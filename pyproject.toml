[project]
name = "vps-raspi-fc"
version = "0.1.0"
description = "WebRTC 2-arah VPS <-> Raspi: Raspi kirim frame USB cam -> VPS YOLO11s -> trigger DataChannel -> Raspi print"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiortc>=1.9.0",
    "av>=12.3.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "ultralytics>=8.3.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
vps-signaling = "vps.signaling_server:main"
vps = "vps.main_vps:main"
raspi = "raspi.main_raspi:main"

[tool.ruff]
line-length = 100
